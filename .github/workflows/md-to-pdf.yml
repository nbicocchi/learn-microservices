name: Auto & Manual Markdown to PDF converter

on:
  push:
    paths:
      - '**/*.md'
  workflow_dispatch:

jobs:
  md-to-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install PDF Toolkit (qpdf)
        run: |
          sudo apt-get update && sudo apt-get install -y qpdf
          npm install -g @mermaid-js/mermaid-cli md-to-pdf
          # Install puppeteer locally so our custom script can use it
          npm install puppeteer 

      - name: Get changed Markdown directories
        id: changed-files
        if: github.event_name == 'push'
        uses: tj-actions/changed-files@v47
        with:
          files: '**/*.md'
          dir_names: true

      - name: Process Markdown to PDF
        if: github.event_name == 'workflow_dispatch' || steps.changed-files.outputs.any_changed == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGED_FOLDERS: ${{ steps.changed-files.outputs.all_changed_files }}
        run: bash .github/scripts/build-md-to-pdf.sh

      - name: Commit generated PDFs
        if: github.event_name == 'workflow_dispatch' || steps.changed-files.outputs.any_changed == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: regenerate standard and continuous scroll PDFs with dynamic cover arts"
          file_pattern: '**/pdf-*/*.pdf'